    </div>
      <div class="info">

          <span class="label">Name:</span>
          <span class="value">D.Chandana</span>
        </div>
        <div class="row">
          <span class="label">Roll No:</span>
          <span class="value">20240123</span>
        </div>
        <div class="row">
          <span class="label">Course:</span>
          <span class="value">B.Tech (CSE)</span>
        </div>
        <div class="row">
          <span class="label">College:</span>
          <span class="value">VIT-AP University</span>
        </div>
      </div>
    </div>  
  </body>
</html>
